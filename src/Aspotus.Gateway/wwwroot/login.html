<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вход в Aspotus</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #f0f2f5;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .card {
            background: #fff;
            border-radius: 12px;
            box-shadow: 0 2px 16px rgba(0,0,0,0.08);
            padding: 40px;
            width: 380px;
            max-width: 90vw;
        }
        h1 { font-size: 24px; margin-bottom: 8px; color: #1a1a2e; }
        p.sub { color: #666; margin-bottom: 24px; font-size: 14px; }
        .field { margin-bottom: 16px; }
        label { display: block; font-size: 13px; font-weight: 600; color: #333; margin-bottom: 4px; }
        input {
            width: 100%; padding: 10px 12px; font-size: 14px;
            border: 1px solid #d9d9d9; border-radius: 6px; outline: none;
            transition: border-color 0.2s;
        }
        input:focus { border-color: #4a7cf7; }
        button {
            width: 100%; padding: 10px; font-size: 15px; font-weight: 600;
            background: #4a7cf7; color: #fff; border: none; border-radius: 6px;
            cursor: pointer; transition: background 0.2s;
        }
        button:hover { background: #3a66d9; }
        .error { color: #e74c3c; font-size: 13px; margin-top: 12px; display: none; }
        .success { color: #27ae60; font-size: 13px; margin-top: 12px; display: none; }
    </style>
</head>
<body>
    <div class="card">
        <h1>Вход в систему</h1>
        <p class="sub">Aspotus Gateway</p>
        <form id="loginForm">
            <div class="field">
                <label for="login">Логин</label>
                <input type="text" id="login" name="login" placeholder="admin" required>
            </div>
            <div class="field">
                <label for="password">Пароль</label>
                <input type="password" id="password" name="password" placeholder="123456" required>
            </div>
            <button type="submit">Войти</button>
            <div class="error" id="errorMsg"></div>
            <div class="success" id="successMsg">Вход выполнен. Перенаправление...</div>
        </form>
    </div>
    <script>
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const login = document.getElementById('login').value;
            const password = document.getElementById('password').value;
            const errorEl = document.getElementById('errorMsg');
            const successEl = document.getElementById('successMsg');

            errorEl.style.display = 'none';
            successEl.style.display = 'none';

            try {
                const res = await fetch('/api/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ login, password })
                });

                if (!res.ok) {
                    const err = await res.json();
                    errorEl.textContent = err.message || 'Ошибка входа';
                    errorEl.style.display = 'block';
                    return;
                }

                const data = await res.json();
                localStorage.setItem('jwt_token', data.token);

                successEl.textContent = 'Вход выполнен. Перенаправление...';
                successEl.style.display = 'block';

                setTimeout(() => {
                    window.location.href = '/swagger';
                }, 800);
            } catch {
                errorEl.textContent = 'Ошибка соединения с сервером.';
                errorEl.style.display = 'block';
            }
        });
    </script>
</body>
</html>
