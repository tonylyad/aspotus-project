name: aspotus-project

services:
  redis:
    image: redis:7.2.14-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - backend

  rabbitmq:
    image: rabbitmq:4-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: aspotus
      RABBITMQ_DEFAULT_PASS: aspotus-dev
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - backend

  catalog-api:
    image: ${DOCKER_REGISTRY-}catalog-api
    build:
      context: .
      dockerfile: Aspotus.Catalog.Api/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:5299
      ConnectionStrings__CatalogDb: Data Source=/data/catalog.db
      ConnectionStrings__Redis: redis:6379
      InternalApiKey: aspotus-internal-dev
    depends_on:
      redis:
        condition: service_healthy
    ports:
      - "5299:5299"
    volumes:
      - ./data/catalog:/data
    networks:
      - backend

  orders-api:
    image: ${DOCKER_REGISTRY-}orders-api
    build:
      context: .
      dockerfile: Aspotus.Orders.Api/Dockerfile
    depends_on:
      - rabbitmq
      - catalog-api
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:5115
      ConnectionStrings__OrdersDb: Data Source=/data/orders.db
      RabbitMq__HostName: rabbitmq
      RabbitMq__Port: 5672
      RabbitMq__UserName: aspotus
      RabbitMq__Password: aspotus-dev
      Catalog__BaseUrl: http://catalog-api:5299/
      Catalog__InternalApiKey: aspotus-internal-dev
    ports:
      - "5115:5115"
    volumes:
      - ./data/orders:/data
    networks:
      - backend

  files-api:
    image: ${DOCKER_REGISTRY-}files-api
    build:
      context: .
      dockerfile: Aspotus.Filestore.Api/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:5133
    ports:
      - "5133:5133"
    networks:
      - backend

  notifications-worker:
    image: ${DOCKER_REGISTRY-}notifications-worker
    build:
      context: .
      dockerfile: Aspotus.Notifications.Worker/Dockerfile
    depends_on:
      - catalog-api
      - rabbitmq
    environment:
      DOTNET_ENVIRONMENT: Development
      ConnectionStrings__NotificationsDb: Data Source=/data/notifications.db
      RabbitMq__HostName: rabbitmq
      RabbitMq__Port: 5672
      RabbitMq__UserName: aspotus
      RabbitMq__Password: aspotus-dev
    volumes:
      - ./data/notifications:/data
    networks:
      - backend

  admin-web:
    image: ${DOCKER_REGISTRY-}admin-web
    build:
      context: .
      dockerfile: Aspotus.Admin.Web/Dockerfile
    depends_on:
      - gateway
    environment:
      VITE_GATEWAY_URL: http://gateway:5230
    ports:
      - "5174:5174"
    networks:
      - backend

  customer-web:
    image: ${DOCKER_REGISTRY-}customer-web
    build:
      context: .
      dockerfile: Aspotus.Customer.Web/Dockerfile
    depends_on:
      - gateway
    environment:
      VITE_GATEWAY_URL: http://gateway:5230
    ports:
      - "5173:5173"
    networks:
      - backend

  gateway:
    image: ${DOCKER_REGISTRY-}gateway
    build:
      context: .
      dockerfile: Aspotus.Gateway/Dockerfile
    depends_on:
      - catalog-api
      - orders-api
      - files-api
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:5230
      ConnectionStrings__DefaultConnection: Data Source=/data/gateway.db
      ReverseProxy__Clusters__catalog-cluster__Destinations__catalog-destination__Address: http://catalog-api:5299/
      ReverseProxy__Clusters__orders-cluster__Destinations__orders-destination__Address: http://orders-api:5115/
      ReverseProxy__Clusters__files-cluster__Destinations__files-destination__Address: http://files-api:5133/
    ports:
      - "5230:5230"
    volumes:
      - ./data/gateway:/data
    networks:
      - backend

networks:
  backend:

volumes:
  rabbitmq-data:
